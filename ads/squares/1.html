<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Squares</title>
<style>:root { color-scheme: light; font-family: system-ui, sans-serif; font-weight: 700; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; overflow: hidden; background: #151522; color: white; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
main {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100dvh; width: 100%; padding: 52px 12px 54px; overflow: hidden;
}
#timer {
  --remaining: 100%; position: absolute; z-index: 2; top: max(12px, env(safe-area-inset-top));
  right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; color: white; background: conic-gradient(#fff var(--remaining), #55566a 0);
}
#timer span { background: #171522; border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; }
#game { position: relative; width: min(100%, 65vh, 430px); text-align: center; }
.cta { padding: 10px 17px; border-radius: 12px; background: #553bd2; min-height: 40px; color: #fff; }
.cta:focus-visible { outline: 3px solid #ffbf36; outline-offset: 3px; }
#playing-cta { position: absolute; bottom: max(8px, env(safe-area-inset-bottom)); }
#end-card { position: absolute; z-index: 1; inset: 0; display: grid; place-items: center; background: #111222f7; }
.card {
  width: min(84%, 350px); background: #202137; border: 2px solid #6e58bb; border-radius: 25px;
  padding: 24px 16px; box-shadow: 0 18px 55px #0005; animation: appear .24s ease-out both;
}
.card img { display: block; width: min(90px, 17vh); margin: 0 auto 12px; border-radius: 20%; }
.card h1, .card p { margin: 0 0 10px; text-align: center; }
.card .publisher { color: #b4b3c8; font-size: .8rem; }
.card .cta { display: block; margin: 18px auto 0; }
.heading { font-size: clamp(16px, 6vw, 28px); margin: 0; }
.score { font-size: clamp(28px, 11vw, 58px); margin: 3px 0 8px; line-height: 1; }
.hint { font-size: clamp(12px, 4vw, 16px); min-height: 20px; margin: 9px 0 0; }
.flash { position: absolute; z-index: 2; pointer-events: none; top: 30%; left: 0; right: 0;
  text-shadow: 0 2px 6px #0008; color: #fff; font-size: clamp(18px, 7vw, 32px); animation: flash .9s ease-out both; }
@keyframes flash { from { opacity:0; transform:translateY(10px) scale(.8); } 22%,68% { opacity:1; } to { opacity:0; transform:translateY(-25px); } }
@keyframes appear { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px #fff9 inset, 0 0 0 2px #171522; } }
.smove main { background: linear-gradient(#b0a6cf, #76c499); }
.smove.level-two main { background: linear-gradient(#65b6c9,#65c2b3); }
.smove .board {
  position: relative; width: min(78%, 44vh); aspect-ratio: 1; margin: 12px auto 0; border: 3px solid #fff;
  border-radius: 16%; display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; touch-action: none;
}
.smove .cell { background: transparent; min-width: 0; border: 1px solid #ffffff55; }
.smove .piece {
  width: 18%; aspect-ratio: 1; position: absolute; pointer-events: none; left: 0; top: 0;
  margin: -9%; transition: left .13s ease, top .13s ease;
}
.smove .player { background: #fff; border-radius: 50%; }
.smove .trail { background: #fff6; border-radius: 50%; transition-duration: .2s; }
.smove .goal { width: 10%; margin: -5%; rotate: 45deg; background: #fff; border-radius: 10%; }
.smove .hazard { width: 13%; height: auto; aspect-ratio: 1; position: absolute; left: -15%; top: 44%; background: #212225; border-radius: 50%;
  animation: hazard 2.6s 1.6s linear infinite alternate; pointer-events: none; }
.smove .hazard.lower { top: 70%; animation-duration: 2.9s; animation-direction: alternate-reverse; }
@keyframes hazard { to { left: 103%; } }
body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }
.squares main { background: #edf2ff; color: #243460; }
.squares .board { width: min(100%, 55vh); margin: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  padding: 9px; border-radius: 21px; background: #2b4063; touch-action: none; }
.squares .cell { position: relative; border-radius: 19%; aspect-ratio: 1; background: #344d74; min-width: 0; }
.squares .tile, .squares .chain i { display: block; border-radius: 21%; background: linear-gradient(#ffffff30, transparent), var(--tile);
  box-shadow: inset 0 -3px #0003; }
.squares .tile { position: absolute; inset: 3px; }
.squares .cell.guide, .numbers-go-up .guide { animation: pulse 1.15s ease-in-out infinite; }
.squares .cell.clearing .tile { transform: scale(.05); transition: transform .18s; }
.squares .chain { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 0 0 7px; }
.squares .chain i { width: clamp(13px, 4.5vw, 20px); aspect-ratio: 1; }
.squares .chain i:first-child { scale: 1.14; }
.numbers-go-up main { background: #191821; color: #fff7ee; }
.numbers-go-up .board { width: min(79%, 42vh); margin: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.numbers-go-up .cell, .numbers-go-up .add {
  aspect-ratio: 1; border-radius: 18%; min-width: 0; font-size: clamp(18px, 7vw, 38px);
  background: linear-gradient(#29292e, #222227) padding-box, linear-gradient(var(--digit), #443b52) border-box;
  border: 3px solid transparent; display: grid; place-items: center;
}
.numbers-go-up .goals { display: flex; justify-content: center; margin: 6px auto 9px; gap: 2px; }
.numbers-go-up .goals span { width: 10%; padding: 2px; border-radius: 6px; background: #363341; font-size: clamp(12px, 4vw, 16px); }
.numbers-go-up .goals .filled { color: #201e26; background: var(--digit); }
.numbers-go-up .tray { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 7px auto 0; }
.numbers-go-up .add { width: min(15%, 8vh); }
.numbers-go-up .next, .numbers-go-up .moves { font-size: .72rem; }
.numbers-go-up .score { color: #ffd740; }
@media (max-height: 480px) and (orientation: landscape) {
  main { padding-top: 18px; padding-bottom: 42px; }
  #game { width: min(52%, 63vh); }
  .score { font-size: 31px; }
  .heading, .hint { font-size: 12px; margin-top: 2px; }
  .numbers-go-up .board { width: min(75%, 33vh); }
  .squares .board { width: min(100%, 53vh); }
}
</style>
</head>

<script>const creative = {"id": "squares", "build": 1};
"use strict";

const game = document.getElementById("game");
const clock = document.getElementById("timer");
const endCard = document.getElementById("end-card");
const duration = 20000;
let elapsed = 0;
let lastFrame = null;
let paused = false;
let ended = false;
let interacted = false;
let completed = false;
let animationFrame;

function emit(type, button) {
  const payload = button ? { type, button } : { type };
  const json = JSON.stringify(payload);
  const ios = window.webkit?.messageHandlers?.crosspromo;
  if (ios) {
    ios.postMessage(json);
  } else if (window.CrosspromoAndroid?.postMessage) {
    window.CrosspromoAndroid.postMessage(json);
  } else if (parent !== window) {
    // The local authoring preview logs the same events as the native viewer.
    parent.postMessage(payload, "*");
  }
}

function live() {
  return !ended && !paused && !document.hidden;
}

function interaction() {
  if (interacted || !live()) return;
  interacted = true;
  emit("interaction");
}

function complete() {
  if (completed || !live()) return;
  completed = true;
  emit("completed");
}

function flash(label) {
  const popup = document.createElement("div");
  popup.className = "flash";
  popup.textContent = label;
  game.append(popup);
  popup.addEventListener("animationend", () => popup.remove(), { once: true });
}

function showEndCard() {
  if (ended) return;
  ended = true;
  cancelAnimationFrame(animationFrame);
  clock.hidden = true;
  game.hidden = true;
  document.getElementById("playing-cta").hidden = true;
  endCard.hidden = false;
  emit("end_card");
}

window.crosspromoEndCard = showEndCard;
window.crosspromoSetPaused = value => {
  paused = Boolean(value);
  lastFrame = null;
  document.body.classList.toggle("paused", paused);
};
document.addEventListener("visibilitychange", () => { lastFrame = null; });

function tick(now) {
  if (ended) return;
  if (live()) {
    if (lastFrame !== null) elapsed += Math.max(0, now - lastFrame);
    lastFrame = now;
    const left = Math.max(0, duration - elapsed);
    clock.style.setProperty("--remaining", (left * 100 / duration) + "%");
    clock.firstElementChild.textContent = Math.ceil(left / 1000);
    if (!left) {
      showEndCard();
      return;
    }
  }
  animationFrame = requestAnimationFrame(tick);
}

function start() {
  createGame();
  document.getElementById("playing-cta").onclick = () => { if (live()) emit("cta", "playable"); };
  document.getElementById("end-cta").onclick = () => { if (ended && !paused && !document.hidden) emit("cta", "end_card"); };
  emit("ready");
  animationFrame = requestAnimationFrame(tick);
}

function createGame() {
  game.innerHTML = `<h2 class="heading">SQUARES</h2><p class="score">0</p>
    <div class="chain" aria-label="Next chain"><i></i><i></i><i></i></div>
    <div class="board" aria-label="Squares board"></div><p class="hint">Drag across three spaces</p>`;
  const board = game.querySelector(".board");
  const scoreLabel = game.querySelector(".score");
  const hint = game.querySelector(".hint");
  const chain = [...game.querySelectorAll(".chain i")];
  const cells = [];
  const tiles = [];
  const pink = "#f75c73";
  const colors = [pink, "#21ccca", "#a642fc"];
  let stage = 0;
  let score = 0;
  let path = [];
  let pointer = null;
  let resolving = false;

  function target() {
    return stage === 0 ? [20, 21, 22] : [10, 11, 12];
  }

  function paint(index, color) {
    tiles[index].hidden = !color;
    if (color) tiles[index].style.setProperty("--tile", color);
  }

  function setup() {
    path = [];
    for (let index = 0; index < cells.length; index++) {
      cells[index].classList.toggle("guide", index === target()[0]);
      cells[index].classList.remove("clearing");
      const prepared = stage > 0 && ([5, 6, 7, 15, 16, 17].includes(index));
      paint(index, prepared ? colors[index % 5] : "");
    }
    chain.forEach((tile, index) => tile.style.setProperty("--tile", stage === 0 ? pink : colors[index]));
    hint.textContent = stage === 0 ? "Drag across three spaces" : "Connect the chain";
  }

  function visit(index) {
    if (index !== target()[path.length]) return;
    if (!path.length) {
      interaction();
      cells[index].classList.remove("guide");
    }
    paint(index, stage === 0 ? pink : colors[path.length]);
    path.push(index);
  }

  function sample(event) {
    const targetCell = document.elementFromPoint(event.clientX, event.clientY)?.closest(".cell");
    const index = cells.indexOf(targetCell);
    if (path.length === 1 && index === target()[2]) visit(target()[1]);
    visit(index);
  }

  function finish() {
    if (path.length < 3) {
      setup();
      return;
    }
    resolving = true;
    const clear = stage ? [5, 6, 7, 10, 11, 12, 15, 16, 17] : target();
    clear.forEach(index => cells[index].classList.add("clearing"));
    setTimeout(() => {
      if (ended) return;
      score += stage ? 54 : 3;
      scoreLabel.textContent = score;
      if (stage) {
        flash("TRIPLE MATCH!");
        complete();
      }
      stage++;
      resolving = false;
      setup();
    }, 225);
  }

  for (let index = 0; index < 25; index++) {
    const cell = document.createElement("button");
    cell.className = "cell";
    cell.setAttribute("aria-label", "Space " + (index + 1));
    const tile = document.createElement("span");
    tile.className = "tile";
    cell.append(tile);
    cell.onclick = event => {
      if (event.detail !== 0 || !live() || resolving || pointer !== null) return;
      visit(index);
      if (path.length === 3) finish();
    };
    board.append(cell);
    cells.push(cell);
    tiles.push(tile);
  }

  board.addEventListener("pointerdown", event => {
    if (!live() || resolving || pointer !== null || !event.isPrimary || event.button !== 0) return;
    const index = cells.indexOf(event.target.closest(".cell"));
    if (index !== target()[0]) return;
    if (path.length) setup();
    pointer = event.pointerId;
    board.setPointerCapture(pointer);
    visit(index);
  });
  board.addEventListener("pointermove", event => {
    if (live() && pointer === event.pointerId) sample(event);
  });
  board.addEventListener("pointerup", event => {
    if (pointer !== event.pointerId) return;
    pointer = null;
    if (live()) {
      sample(event);
      finish();
    } else {
      setup();
    }
  });
  board.addEventListener("pointercancel", event => {
    if (pointer === event.pointerId) {
      pointer = null;
      setup();
    }
  });
  setup();
}

start();
</script>
</body>
</html>
