<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Numbers Go Up</title>
<style>:root { color-scheme: light; font-family: system-ui, sans-serif; font-weight: 700; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; overflow: hidden; background: #151522; color: white; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
main {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100dvh; width: 100%; padding: 52px 12px 54px; overflow: hidden;
}
#timer {
  --remaining: 100%; position: absolute; z-index: 2; top: max(12px, env(safe-area-inset-top));
  right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; color: white; background: conic-gradient(#fff var(--remaining), #55566a 0);
}
#timer span { background: #171522; border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; }
#game { position: relative; width: min(100%, 65vh, 430px); text-align: center; }
.cta { padding: 10px 17px; border-radius: 12px; background: #553bd2; min-height: 40px; color: #fff; }
.cta:focus-visible { outline: 3px solid #ffbf36; outline-offset: 3px; }
#playing-cta { position: absolute; bottom: max(8px, env(safe-area-inset-bottom)); }
#end-card { position: absolute; z-index: 1; inset: 0; display: grid; place-items: center; background: #111222f7; }
.card {
  width: min(84%, 350px); background: #202137; border: 2px solid #6e58bb; border-radius: 25px;
  padding: 24px 16px; box-shadow: 0 18px 55px #0005; animation: appear .24s ease-out both;
}
.card img { display: block; width: min(90px, 17vh); margin: 0 auto 12px; border-radius: 20%; }
.card h1, .card p { margin: 0 0 10px; text-align: center; }
.card .publisher { color: #b4b3c8; font-size: .8rem; }
.card .cta { display: block; margin: 18px auto 0; }
.heading { font-size: clamp(16px, 6vw, 28px); margin: 0; }
.score { font-size: clamp(28px, 11vw, 58px); margin: 3px 0 8px; line-height: 1; }
.hint { font-size: clamp(12px, 4vw, 16px); min-height: 20px; margin: 9px 0 0; }
.flash { position: absolute; z-index: 2; pointer-events: none; top: 30%; left: 0; right: 0;
  text-shadow: 0 2px 6px #0008; color: #fff; font-size: clamp(18px, 7vw, 32px); animation: flash .9s ease-out both; }
@keyframes flash { from { opacity:0; transform:translateY(10px) scale(.8); } 22%,68% { opacity:1; } to { opacity:0; transform:translateY(-25px); } }
@keyframes appear { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px #fff9 inset, 0 0 0 2px #171522; } }
.smove main { background: linear-gradient(#b0a6cf, #76c499); }
.smove.level-two main { background: linear-gradient(#65b6c9,#65c2b3); }
.smove .board {
  position: relative; width: min(78%, 44vh); aspect-ratio: 1; margin: 12px auto 0; border: 3px solid #fff;
  border-radius: 16%; display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; touch-action: none;
}
.smove .cell { background: transparent; min-width: 0; border: 1px solid #ffffff55; }
.smove .piece {
  width: 18%; aspect-ratio: 1; position: absolute; pointer-events: none; left: 0; top: 0;
  margin: -9%; transition: left .13s ease, top .13s ease;
}
.smove .player { background: #fff; border-radius: 50%; }
.smove .trail { background: #fff6; border-radius: 50%; transition-duration: .2s; }
.smove .goal { width: 10%; margin: -5%; rotate: 45deg; background: #fff; border-radius: 10%; }
.smove .hazard { width: 13%; height: auto; aspect-ratio: 1; position: absolute; left: -15%; top: 44%; background: #212225; border-radius: 50%;
  animation: hazard 2.6s 1.6s linear infinite alternate; pointer-events: none; }
.smove .hazard.lower { top: 70%; animation-duration: 2.9s; animation-direction: alternate-reverse; }
@keyframes hazard { to { left: 103%; } }
body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }
.squares main { background: #edf2ff; color: #243460; }
.squares .board { width: min(100%, 55vh); margin: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  padding: 9px; border-radius: 21px; background: #2b4063; touch-action: none; }
.squares .cell { position: relative; border-radius: 19%; aspect-ratio: 1; background: #344d74; min-width: 0; }
.squares .tile, .squares .chain i { display: block; border-radius: 21%; background: linear-gradient(#ffffff30, transparent), var(--tile);
  box-shadow: inset 0 -3px #0003; }
.squares .tile { position: absolute; inset: 3px; }
.squares .cell.guide, .numbers-go-up .guide { animation: pulse 1.15s ease-in-out infinite; }
.squares .cell.clearing .tile { transform: scale(.05); transition: transform .18s; }
.squares .chain { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 0 0 7px; }
.squares .chain i { width: clamp(13px, 4.5vw, 20px); aspect-ratio: 1; }
.squares .chain i:first-child { scale: 1.14; }
.numbers-go-up main { background: #191821; color: #fff7ee; }
.numbers-go-up .board { width: min(79%, 42vh); margin: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.numbers-go-up .cell, .numbers-go-up .add {
  aspect-ratio: 1; border-radius: 18%; min-width: 0; font-size: clamp(18px, 7vw, 38px);
  background: linear-gradient(#29292e, #222227) padding-box, linear-gradient(var(--digit), #443b52) border-box;
  border: 3px solid transparent; display: grid; place-items: center;
}
.numbers-go-up .goals { display: flex; justify-content: center; margin: 6px auto 9px; gap: 2px; }
.numbers-go-up .goals span { width: 10%; padding: 2px; border-radius: 6px; background: #363341; font-size: clamp(12px, 4vw, 16px); }
.numbers-go-up .goals .filled { color: #201e26; background: var(--digit); }
.numbers-go-up .tray { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 7px auto 0; }
.numbers-go-up .add { width: min(15%, 8vh); }
.numbers-go-up .next, .numbers-go-up .moves { font-size: .72rem; }
.numbers-go-up .score { color: #ffd740; }
@media (max-height: 480px) and (orientation: landscape) {
  main { padding-top: 18px; padding-bottom: 42px; }
  #game { width: min(52%, 63vh); }
  .score { font-size: 31px; }
  .heading, .hint { font-size: 12px; margin-top: 2px; }
  .numbers-go-up .board { width: min(75%, 33vh); }
  .squares .board { width: min(100%, 53vh); }
}

.numbers-go-up main { background: #111113; color: #faf5ed; }
.numbers-go-up #game {
  width: min(100%, calc(73dvh * 1.18), 432px);
  container-type: inline-size;
}
.numbers-go-up .heading { font-size: clamp(17px, 6.5cqw, 28px); padding-inline: 12px; }
.numbers-go-up .score { color: #faf5ed; font-size: clamp(30px, 12cqw, 52px); margin: 3px 0 9px; }
.numbers-go-up .goals {
  display: grid; grid-template-columns: repeat(9, 1fr); align-items: center;
  width: 91.389%; aspect-ratio: 658 / 88; margin: 0 auto 12px; padding: 0 2.04%;
  border: max(1px, .42cqw) solid #4a4a4f; border-radius: 999px; background: #111113;
}
.numbers-go-up .goals span {
  display: grid; place-items: center; justify-self: center; width: 80%; aspect-ratio: 56 / 62;
  padding: 0; border-radius: 28%; background: transparent; font-size: 5.28cqw;
  transition: background .22s ease, color .22s ease;
}
.numbers-go-up .goals .filled { background: var(--digit); color: #111113; }
.numbers-go-up .goals { position: relative; }
.numbers-go-up .goals.rainbow { animation: ngu-rainbow-border 2.5s linear infinite; }
.numbers-go-up .goals.rainbow-bounce {
  animation: ngu-rainbow-border 2.5s linear infinite, ngu-rainbow-bounce .45s ease-out;
}
.numbers-go-up .board {
  position: relative; width: 59.167%; margin: 0 auto; gap: 2.113%;
  grid-template-columns: repeat(3,minmax(0,1fr)); grid-template-rows: repeat(3,minmax(0,1fr)); aspect-ratio: 1;
}
.numbers-go-up .cell {
  position: relative; width: 100%; height: 100%; overflow: visible; padding: 0;
  border: 0; background: transparent; transition: --digit .12s ease-in-out;
  -webkit-tap-highlight-color: transparent;
}
.numbers-go-up .tile-outline, .numbers-go-up .tile-front, .numbers-go-up .tile-face, .numbers-go-up .glyph {
  pointer-events: none; position: absolute; inset: 0;
}
.numbers-go-up .tile-outline {
  background: linear-gradient(var(--digit), color-mix(in srgb, var(--digit) 48%, black));
  -webkit-mask: var(--ngu-sheet) 0 0 / 600% 200% no-repeat;
  mask: var(--ngu-sheet) 0 0 / 600% 200% no-repeat;
}
.numbers-go-up .tile-face, .numbers-go-up .glyph {
  background-image: var(--ngu-sheet);
  background-repeat: no-repeat; background-size: 600% 200%;
}
.numbers-go-up .tile-face { background-position: 20% 0; }
.numbers-go-up .cell.guide { animation: none; z-index: 1; }
.numbers-go-up .cell.guide .tile-outline { animation: ngu-guide 1s ease-in-out infinite; }
.numbers-go-up .pointer {
  position: absolute; z-index: 3; width: 56%; left: 48%; top: 52%;
  pointer-events: none; animation: ngu-point .78s ease-in-out infinite;
}
.numbers-go-up .pointer svg { display: block; width: 100%; filter: drop-shadow(0 2px 2px #000b); }
.numbers-go-up .counting .tile-front { animation: ngu-count .09s ease-in-out alternate infinite; }
.numbers-go-up .land { animation: ngu-land .22s ease-in-out; }
.numbers-go-up .match { z-index: 2; animation: ngu-match .3s ease-in-out; }
.numbers-go-up .refill { animation: ngu-land .22s ease-in-out; }
.numbers-go-up .tray { margin: 10px auto 0; }
.numbers-go-up .add {
  position: relative; display: block; width: 22%; aspect-ratio: 175 / 135;
  border: 0; border-radius: 18%; background: linear-gradient(var(--digit), color-mix(in srgb, var(--digit) 68%, black));
  color: #111113;
}
.numbers-go-up .add .plus { position: absolute; width: 44%; left: 0; top: 50%; transform: translateY(-53%); font-size: 8cqw; }
.numbers-go-up .add .glyph { inset: 0 0 0 auto; height: 100%; aspect-ratio: 1; filter: brightness(.08); }
.numbers-go-up .add.spent { visibility: hidden; }
.numbers-go-up .flying-add { position: absolute; z-index: 6; pointer-events: none; }
.numbers-go-up .timer-close {
  width: 44px; height: 44px; border-radius: 50%; padding: 0;
  background: #171522; box-shadow: inset 0 0 0 2px #fff5; font-size: 22px;
}

.numbers-go-up #playing-cta { width: min(86%, 340px); bottom: max(8px, env(safe-area-inset-bottom)); }
.numbers-go-up .card .cta { width: 100%; }
@keyframes ngu-count { from { transform: scale(.90); } to { transform: scale(.95); } }
@keyframes ngu-land { 0% { transform:scale(.95); } 23% { transform:scale(.90); } 62% { transform:scale(1.10); } 100% { transform:scale(1); } }
@keyframes ngu-match { 0%, 100% { transform:scale(1); } 40% { transform:scale(1.14); } 67% { transform:scale(.92); } }
@keyframes ngu-guide { 50% { filter: brightness(1.5) drop-shadow(0 0 4px #fff7); } }
@keyframes ngu-point { 0%, 100% { transform: translate(4px,7px) rotate(-17deg); } 50% { transform:translate(-3px,-3px) rotate(-17deg); } }
@keyframes ngu-rainbow-border {
  0%, 100% { border-color:#ff4a74; }
  20% { border-color:#ffd740; } 40% { border-color:#42d688; }
  60% { border-color:#39cfe3; } 80% { border-color:#bb64ff; }
}
@keyframes ngu-rainbow-bounce { 20% { transform:scale(.9); } 58% { transform:scale(1.1); } }
@keyframes ngu-rainbow-float {
  0% { opacity:1; transform:translateY(0); }
  26% { transform:translateY(-.9em) scale(1.1); } 70% { opacity:1; }
  100% { opacity:0; transform:translateY(-2.4em); }
}
@keyframes ngu-rainbow-gradient { to { background-position: 100% 0; } }
@keyframes ngu-points {
  0% { opacity:0; transform:translate(-50%,5px) scale(.65); }
  24% { opacity:1; transform:translate(-50%,-6px) scale(1.12); }
  65% { opacity:1; }
  100% { opacity:0; transform:translate(-50%,-48px) scale(1); }
}
@media (max-height: 580px) {
  .numbers-go-up main { padding: 38px 12px 60px; }

  .numbers-go-up .goals { margin-bottom: 8px; }
  .numbers-go-up .tray { margin-top: 7px; }
}
</style>

<script>const creative = {"id": "numbers-go-up", "build": 3};
"use strict";

const game = document.getElementById("game");
const clock = document.getElementById("timer");
const endCard = document.getElementById("end-card");
const duration = 20000;
let elapsed = 0;
let lastFrame = null;
let paused = false;
let ended = false;
let interacted = false;
let completed = false;
let animationFrame;

function emit(type, button) {
  const payload = button ? { type, button } : { type };
  const json = JSON.stringify(payload);
  const ios = window.webkit?.messageHandlers?.crosspromo;
  if (ios) {
    ios.postMessage(json);
  } else if (window.CrosspromoAndroid?.postMessage) {
    window.CrosspromoAndroid.postMessage(json);
  } else if (parent !== window) {
    // The local authoring preview logs the same events as the native viewer.
    parent.postMessage(payload, "*");
  }
}

function live() {
  return !ended && !paused && !document.hidden;
}

function interaction() {
  if (interacted || !live()) return;
  interacted = true;
  emit("interaction");
}

function complete() {
  if (completed || !live()) return;
  completed = true;
  emit("completed");
}

function flash(label) {
  const popup = document.createElement("div");
  popup.className = "flash";
  popup.textContent = label;
  game.append(popup);
  popup.addEventListener("animationend", () => popup.remove(), { once: true });
}

function showEndCard() {
  if (ended) return;
  ended = true;
  cancelAnimationFrame(animationFrame);
  clock.hidden = true;
  game.hidden = true;
  document.getElementById("playing-cta").hidden = true;
  endCard.hidden = false;
  emit("end_card");
}

window.crosspromoEndCard = showEndCard;
window.crosspromoSetPaused = value => {
  paused = Boolean(value);
  lastFrame = null;
  document.body.classList.toggle("paused", paused);
};
document.addEventListener("visibilitychange", () => { lastFrame = null; });

function tick(now) {
  if (ended) return;
  if (live()) {
    if (lastFrame !== null) elapsed += Math.max(0, now - lastFrame);
    lastFrame = now;
    const left = Math.max(0, duration - elapsed);
    clock.style.setProperty("--remaining", (left * 100 / duration) + "%");
    clock.firstElementChild.textContent = Math.ceil(left / 1000);
    if (!left) {
      showTimerClose();
      return;
    }
  }
  animationFrame = requestAnimationFrame(tick);
}

function start() {
  createGame();
  document.getElementById("playing-cta").onclick = () => { if (live()) emit("cta", "playable"); };
  document.getElementById("end-cta").onclick = () => { if (ended && !paused && !document.hidden) emit("cta", "end_card"); };
  emit("ready");
  animationFrame = requestAnimationFrame(tick);
}

function showTimerClose() {
  // Installed app viewers already own the close control and filter creative messages.
  if (window.webkit?.messageHandlers?.crosspromo || window.CrosspromoAndroid?.postMessage) {
    clock.hidden = true;
    return;
  }
  const close = document.createElement("button");
  close.type = "button";
  close.className = "timer-close";
  close.setAttribute("aria-label", "Close ad");
  close.textContent = "✕";
  close.onclick = () => {
    if (!live()) return;
    ended = true;
    close.closest("main").hidden = true;
    emit("close");
  };
  clock.replaceChildren(close);
  clock.removeAttribute("aria-label");
}

function createGame() {
  game.innerHTML = `<h2 class="heading">Match three numbers!</h2><p class="score">2,442</p>
    <div class="goals" aria-label="Rainbow progress"></div>
    <div class="board" aria-label="Number board"></div>
    <div class="tray"><span class="add"><span class="plus">+</span><span class="glyph"></span></span></div>
    <p class="hint" aria-live="polite">Tap where the hand points</p>`;
  const board = game.querySelector(".board");
  const goals = game.querySelector(".goals");
  const scoreLabel = game.querySelector(".score");
  const add = game.querySelector(".add");
  const addGlyph = add.querySelector(".glyph");
  const hint = game.querySelector(".hint");
  const tiles = [];
  const digits = [7, 6, 7, 8, 8, 6, 6, 9, 9];
  const colors = ["#474057", "#ff4a74", "#ff913c", "#ffd740", "#b0e63f", "#42d688", "#39cfe3", "#4e93ff", "#7764ff", "#bb64ff"];
  const claimed = new Set([1, 2, 3, 4, 5, 6]);
  const lines = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];
  const lesson = [1, 5, 6];
  const hand = document.createElement("span");
  hand.className = "pointer";
  hand.setAttribute("aria-hidden", "true");
  hand.innerHTML = '<svg viewBox="0 0 44 48"><path fill="#fff5ed" stroke="#111113" stroke-width="2.5" stroke-linejoin="round" d="M15 27V8a4 4 0 1 1 8 0v13a4 4 0 0 1 7-1 4 4 0 0 1 7 2c4-1 6 1 6 5v7c0 6-4 11-10 11h-9c-4 0-7-2-9-5L6 29c-4-5 1-9 5-5z"/></svg>';
  let turn = 0;
  let amount = 1;
  let target = lesson[0];
  let score = 2442;
  let displayedScore = score;
  let busy = false;

  function frame(element, slot) {
    element.style.backgroundPosition = (slot % 6 * 20) + "% " + (slot >= 6 ? 100 : 0) + "%";
  }

  // Authored 90ms number ticks and 120ms outline fades use foreground time.
  function animate(ms, draw) {
    return new Promise(resolve => {
      let total = 0;
      let previous = null;
      function step(now) {
        if (ended) { resolve(false); return; }
        if (live()) {
          if (previous !== null) total += Math.min(50, now - previous);
          previous = now;
          draw?.(Math.min(1, total / ms));
        } else previous = null;
        if (total >= ms) resolve(true);
        else requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  function showDigit(index) {
    const tile = tiles[index];
    const digit = digits[index];
    frame(tile.querySelector(".glyph"), digit + 2);
    tile.style.setProperty("--digit", colors[digit]);
    tile.setAttribute("aria-label", "Tile " + (index + 1) + ", " + digit);
  }

  function renderGuide() {
    hand.remove();
    for (const [index, tile] of tiles.entries()) {
      tile.classList.toggle("guide", !busy && index === target);
    }
    if (!busy && turn < lesson.length) tiles[target].append(hand);
    frame(addGlyph, amount + 2);
    add.style.setProperty("--digit", colors[amount]);
    add.setAttribute("aria-label", "Add " + amount);
    hint.textContent = turn < lesson.length ? "Tap where the hand points" : "Tap the highlighted tile";
  }

  function canMatch(index, value) {
    const result = (digits[index] + value) % 10;
    return result > 0 && lines.some(line => line.includes(index) &&
      line.every(cell => cell === index || digits[cell] === result));
  }

  function chooseNext() {
    // Prefer a one-tap match. If the board has none, bring a pair one step from
    // completion so every offer in the preview still has a matching move.
    for (const value of [1, 2, 3]) {
      const index = digits.findIndex((_, cell) => canMatch(cell, value));
      if (index >= 0) { amount = value; target = index; return; }
    }
    const line = lines.find(row => digits[row[0]] > 0 && digits[row[0]] === digits[row[1]]);
    const [first, middle, last] = line || lines[turn % 3];
    const value = digits[first] || 3;
    amount = turn % 3 + 1;
    target = last;
    digits[first] = digits[middle] = value;
    digits[last] = (value + 10 - amount) % 10;
    [first, middle, last].forEach(showDigit);
    tiles[last].classList.add("refill");
    tiles[last].addEventListener("animationend", () => tiles[last].classList.remove("refill"), { once: true });
  }

  async function flyToTile(tile) {
    const source = add.getBoundingClientRect();
    const destination = tile.getBoundingClientRect();
    const origin = game.getBoundingClientRect();
    const number = add.cloneNode(true);
    number.classList.add("flying-add");
    number.setAttribute("aria-hidden", "true");
    number.style.left = (source.left - origin.left) + "px";
    number.style.top = (source.top - origin.top) + "px";
    number.style.width = source.width + "px";
    game.append(number);
    add.classList.add("spent");
    const x = destination.left + (destination.width - source.width) / 2 - source.left;
    const y = destination.top + (destination.height - source.height) / 2 - source.top;
    const arrived = await animate(230, progress => {
      const travel = 1 - (1 - progress) ** 2;
      number.style.transform = `translate(${x * travel}px, ${y * travel}px)`;
    });
    const landed = arrived && await animate(130, progress => {
      number.style.transform = `translate(${x}px, ${y}px) scale(${1 - progress * .85})`;
      number.style.opacity = 1 - progress;
    });
    number.remove();
    return landed;
  }

  function addScore(points) {
    score += points;
    const from = displayedScore;
    const total = score;
    animate(400, progress => {
      displayedScore = Math.round(from + (total - from) * (1 - (1-progress) ** 3));
      scoreLabel.textContent = displayedScore.toLocaleString("en-US");
    });
  }

  function award(points, color, index) {
    addScore(points);
    const pop = document.createElement("div");
    pop.className = "points";
    pop.style.setProperty("--points-color", color);
    pop.style.setProperty("--col", (index % 3 + .5) / 3 * 100 + "%");
    pop.style.setProperty("--row", (Math.floor(index / 3) + .5) / 3 * 100 + "%");
    pop.textContent = "+" + points.toLocaleString("en-US");
    board.append(pop);
    pop.addEventListener("animationend", () => pop.remove(), { once: true });
  }

  async function celebrateRainbow() {
    const tally = document.createElement("div");
    tally.className = "rainbow-tally";
    goals.append(tally);
    goals.classList.add("rainbow");
    let bonus = 0;
    if (!(await animate(200))) return false;
    for (let digit = 1; digit <= 9; digit++) {
      const block = goals.children[digit - 1];
      bonus += digit * 111;
      tally.textContent = bonus.toLocaleString("en-US");
      tally.style.color = colors[digit];
      if (!(await animate(250, progress => {
        block.style.opacity = 1 - progress;
        block.style.transform = `scale(${1 + .35 * progress})`;
        tally.style.scale = 1 - .1 * Math.sin(progress * Math.PI);
      }))) return false;
    }
    if (!(await animate(200))) return false;
    for (let index = 0; index < 9; index++) {
      const block = goals.children[index];
      block.classList.remove("filled");
      block.style.opacity = "";
      block.style.transform = "";
    }
    claimed.clear();
    tally.style.scale = "";
    tally.classList.add("rainbow-float");
    goals.classList.add("rainbow-bounce");
    addScore(bonus);
    complete();
    if (!(await animate(1000))) return false;
    goals.classList.remove("rainbow", "rainbow-bounce");
    tally.remove();
    return true;
  }

  async function advance(index) {
    if (!live() || busy || (turn < 3 && index !== target)) return;
    interaction();
    busy = true;
    renderGuide();
    const movingTile = tiles[index];
    if (!(await flyToTile(movingTile))) return;
    movingTile.classList.add("counting");
    for (let step = 1; step <= amount; step++) {
      digits[index] = (digits[index] + 1) % 10;
      showDigit(index);
      if (step < amount && !(await animate(90))) return;
    }
    movingTile.classList.remove("counting");
    movingTile.classList.add("land");
    if (!(await animate(220))) return;
    movingTile.classList.remove("land");
    for (const line of lines) {
      const number = digits[index];
      if (!line.includes(index) || !number || !line.every(cell => digits[cell] === number)) continue;
      const [first, middle, last] = line;
      line.forEach(cell => tiles[cell].classList.add("match"));
      award(number * 111, colors[number], middle);
      claimed.add(number);
      goals.children[number - 1].classList.add("filled");
      if (!(await animate(300))) return;
      digits[first] = digits[last] = 0;
      digits[middle] = number === 9 ? 1 : number + 1;
      line.forEach(cell => { tiles[cell].classList.remove("match"); showDigit(cell); });
    }
    turn++;
    if (claimed.size === 9 && !(await celebrateRainbow())) return;
    if (turn < 3) { amount = turn + 1; target = lesson[turn]; }
    else chooseNext();
    busy = false;
    add.classList.remove("spent");
    renderGuide();
  }

  for (let digit = 1; digit <= 9; digit++) {
    const goal = document.createElement("span");
    goal.textContent = digit;
    goal.style.setProperty("--digit", colors[digit]);
    goal.classList.toggle("filled", claimed.has(digit));
    goals.append(goal);
  }
  for (let index = 0; index < 9; index++) {
    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "cell";
    tile.innerHTML = '<span class="tile-outline"></span><span class="tile-front"><span class="tile-face"></span><span class="glyph"></span></span>';
    tile.onclick = () => advance(index);
    board.append(tile);
    tiles.push(tile);
    showDigit(index);
  }
  renderGuide();
}

start();
</script>
</body>
</html>
